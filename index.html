:root{--bg:#0d1020;--card:#171c34;--tx:#eef1fb;--mut:#a3aed0;--ac:#8b7cff;--ac2:#2dd4bf;--ok:#34d399;--bad:#fb7185;--bd:#2b3258;--gold:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f4f6fc;--card:#fff;--tx:#18203a;--mut:#5a6685;--ac:#5b4be8;--ac2:#0d9488;--ok:#15803d;--bad:#dc2626;--bd:#d8def0;--gold:#d97706;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,color-mix(in srgb,var(--ac) 25%,transparent),transparent),var(--bg);color:var(--tx);font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body.dys{font-family:"OpenDyslexic","Comic Sans MS",sans-serif;font-size:16px;line-height:1.8}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.8rem 1rem;max-width:880px;margin:0 auto}
.brand{font-weight:700;font-size:1.2rem;cursor:pointer;background:none;border:0}
.btns{display:flex;gap:.45rem;flex-wrap:wrap}
.ib{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:.3rem .85rem;cursor:pointer;font-size:.85rem}
.ib.on{border-color:var(--ac);background:var(--ac);color:#fff}
.xp{color:var(--gold);font-weight:700;cursor:default}
main{max-width:880px;margin:0 auto;padding:0 1rem 4rem}
h1{font-size:clamp(1.7rem,6vw,2.5rem);margin:.4rem 0;line-height:1.2}
h2{margin:1.4rem 0 .3rem}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-top:1rem}
.tile{display:flex;flex-direction:column;gap:.35rem;text-align:left;min-height:180px;border:2px solid var(--bd);border-radius:22px;background:var(--card);padding:1.2rem;cursor:pointer;transition:.15s}
.tile:hover:not(.lock){border-color:var(--ac);transform:translateY(-3px)}
.tile.lock{opacity:.4;cursor:default}
.tile b{font-size:1.3rem}.tile small{color:var(--mut);margin-top:auto}
.ic{font-size:2.3rem}
.back{background:none;border:0;color:var(--ac);cursor:pointer;padding:.3rem 0;font-weight:700}
.node{display:flex;align-items:center;gap:1rem;width:min(100%,520px);text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:.8rem 1rem;margin:.8rem 0;cursor:pointer;transition:.15s}
.node:nth-child(3n+2){margin-left:2.5rem}.node:nth-child(3n){margin-left:1.2rem}
.node:hover{border-color:var(--ac)}
.ring{--p:0;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac2) calc(var(--p)*1%),var(--bd) 0)}
.ring span{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.6rem}
.node.full .ring{background:var(--gold)}
.node small{color:var(--mut);display:block}
.thead{display:flex;gap:1rem;align-items:center}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0}
.chip{border:2px solid var(--ac);background:transparent;color:var(--ac);border-radius:99px;padding:.4rem 1rem;cursor:pointer;font-weight:700}
.chip.on{background:var(--ac);color:#fff}
.card,details{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:1.2rem;margin:.8rem 0}
details{padding:.8rem 1.1rem}
summary{cursor:pointer;font-weight:700;list-style:none}
summary::before{content:"▸ ";color:var(--ac)}
details[open] summary::before{content:"▾ "}
details p,details ul{margin:.6rem 0 0}
.goal{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
code{background:var(--bg);padding:.1rem .4rem;border-radius:6px}
a{color:var(--ac)}
.bar{height:14px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:.4rem 0 .8rem}
.dots{display:flex;gap:.35rem;align-items:center;color:var(--mut);font-size:.85rem;margin-bottom:.6rem}
.dots b{width:14px;height:14px;border-radius:50%;background:var(--bd);display:inline-block}
.dots b.f{background:var(--ok)}
.q{font-size:1.2rem;font-weight:700;margin:0 0 .8rem}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.8rem 1rem;border-radius:14px;border:2px solid var(--bd);background:var(--bg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.sel{border-color:var(--ac2);background:color-mix(in srgb,var(--ac2) 22%,var(--bg))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--bg))}
.fb{margin-top:1rem;padding:.8rem 1rem;border-radius:14px;background:var(--bg);border-left:5px solid var(--ac)}
.fb.g{border-color:var(--ok)}.fb.w{border-color:var(--bad)}
.fb p{margin:.2rem 0}
.go{margin-top:.8rem;padding:.75rem 1.5rem;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.center{text-align:center}
.grade{font-size:clamp(4rem,18vw,7rem);font-weight:700;line-height:1.1;margin:.2rem 0}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>
</head>

<script>
const SK=[
["Waarop zijn de elementen in het periodiek systeem gerangschikt?",["Atoomnummer","Atoommassa","Alfabet"],"Op volgorde van atoomnummer. Dat is het aantal protonen in de kern."],
["Wat is het atoomnummer van een atoom?",["Het aantal protonen","Het aantal neutronen","Het aantal schillen"],"Het atoomnummer is het aantal protonen. Bij een neutraal atoom is het ook het aantal elektronen."],
["Waar zoek je het atoomnummer van een element op?",["In het periodiek systeem, Binas of op internet (bijvoorbeeld ptable.com)","Je moet het altijd zelf uitrekenen","Dat staat nergens"],"Zoek op de naam of het symbool van het element. Het atoomnummer staat meestal boven het symbool."],
["Waaruit bestaat de atoomkern?",["Protonen en neutronen","Protonen en elektronen","Neutronen en elektronen"],"De kern heeft protonen (positief) en neutronen (neutraal). Elektronen zitten buiten de kern."],
["Waar bevinden de elektronen zich in het model van Bohr?",["In schillen rond de kern","In de kern","Los tussen de atomen"],"Bij Bohr draaien de elektronen (negatief) in schillen rond de kern."],

["Een neutraal atoom heeft atoomnummer 11. Hoeveel elektronen heeft het?",["11","10","12"],"Neutraal betekent evenveel elektronen als protonen. Atoomnummer 11 betekent 11 protonen, dus 11 elektronen."],

["Wat zijn edelgassen?",["Elementen met een volle buitenste schil die bijna niet reageren","Gassen die goud bevatten","Metalen die niet roesten"],"Edelgassen (He, Ne, Ar) hebben een volle buitenste schil. Dat is stabiel."],
["Waarom heeft helium een edelgasconfiguratie?",["De K-schil is vol met 2 elektronen","Helium heeft 8 valentie-elektronen","Helium heeft geen elektronen"],"Bij helium is de enige schil (K) vol met 2 elektronen. Bij de andere edelgassen zijn er 8 in de buitenste schil."],

["Magnesium heeft atoomnummer 12. Hoeveel valentie-elektronen?",["2","12","8"],"K 2, L 8, M 2. De buitenste schil heeft 2 elektronen."],
["Een element staat in groep 16 van het periodiek systeem. Hoeveel valentie-elektronen heeft het?",["6","16","2"],"Voor groep 13 tot 18 geldt: groepsnummer min 10. Groep 16 geeft dus 6."],

["Waartussen ontstaat een metaalbinding?",["Metaalatomen, met vrije elektronen tussen de positieve metaalionen","Water en zout","Twee niet-metaalatomen"],"Metaalatomen geven valentie-elektronen af. Die bewegen vrij tussen de positieve ionen."],
["Zuurstof heeft 6 valentie-elektronen. Hoeveel covalente bindingen maakt een O-atoom meestal?",["2","6","1"],"Het mist er 2 om 8 te hebben (8 min 6), dus deelt het 2 elektronen: 2 bindingen."],

<details open><summary>Periodiek systeem en atoomnummer<span class="goal">Rangschikking, atoomnummer opzoeken</span></summary>
<p>De elementen staan in het periodiek systeem op volgorde van atoomnummer. Het atoomnummer is het aantal protonen in de kern.</p>
<p>Een atoomnummer zoek je op in Binas of op internet, bijvoorbeeld op <a href="https://ptable.com" target="_blank" rel="noopener">ptable.com</a>. Zoek op de naam of het symbool van het element.</p></details>

<details><summary>Het atoommodel van Bohr<span class="goal">Kern, protonen, neutronen, schillen</span></summary>
<p>Bij Bohr zit in het midden de atoomkern. Die bestaat uit protonen (positief) en neutronen (neutraal). Rond de kern bewegen elektronen (negatief) in schillen.</p>
<p>De schillen heten K, L en M, van binnen naar buiten. Maximaal passen er in de K-schil 2, in de L-schil 8 en in de M-schil 18 elektronen. Bij de eerste 18 elementen blijft de M-schil bij 8 staan.</p>
<p>Elektronen vullen eerst de binnenste schil, dan pas de volgende.</p></details>

<details><summary>Edelgassen en valentie-elektronen<span class="goal">Edelgasconfiguratie, valentie</span></summary>
<p>Edelgassen (He, Ne, Ar) reageren bijna nooit. Hun buitenste schil is vol (helium 2, de rest 8). Dat heet een edelgasconfiguratie en die is stabiel.</p>
<p>Valentie-elektronen zijn de elektronen in de buitenste schil. Je telt ze met het atoomnummer en de schillen: vul de schillen en kijk hoeveel er in de laatste zitten. In het periodiek systeem lees je het af uit de groep (groep 1 = 1, groep 2 = 2, groep 13 = 3, groep 14 = 4, groep 15 = 5, groep 16 = 6, groep 17 = 7, groep 18 = 8).</p></details>

<details><summary>Streven naar stabiliteit en soorten binding<span class="goal">Covalent, ion, metaal</span></summary>
<p>Atomen willen een volle buitenste schil, zoals een edelgas. Ze geven elektronen af, nemen ze op of delen ze.</p>
<ul>
<li><b>Covalente binding:</b> tussen niet-metaalatomen. Ze delen elektronenparen. Zuurstof heeft 6 valentie-elektronen en deelt er 2, dus O maakt 2 bindingen.</li>
<li><b>Ionbinding:</b> tussen metaal- en niet-metaalionen. Een metaal geeft elektronen af (positief ion), een niet-metaal neemt ze op (negatief ion). Tegengestelde ladingen trekken elkaar aan.</li>
<li><b>Metaalbinding:</b> tussen metaalatomen. Ze staan valentie-elektronen af die vrij tussen de positieve metaalionen bewegen.</li>

<p>Lading van een ion: Na heeft 1 valentie-elektron en geeft dat af, dus Na⁺. Cl heeft 7 en neemt er 1 op, dus Cl⁻. Mg geeft 2 af, dus Mg²⁺.</p></details>

<details><summary>Ionen en zouten<span class="goal">Zout vormen, oplossen, kristalrooster</span></summary>
<p>Een zout bestaat uit positieve metaalionen en negatieve niet-metaalionen. Samen zijn ze elektrisch neutraal. De lading van de positieve en negatieve ionen moet elkaar opheffen, bijvoorbeeld MgCl₂ (1 × 2+ en 2 × 1−).</p>
<p>In een vast zout staan de ionen in een vast patroon: het kristalrooster. Elk ion zit tussen ionen met de tegengestelde lading.</p>
<p>Bij oplossen in water laten de ionen los uit het rooster en zweven ze vrij rond. Je schrijft dat zo: <code>NaCl (s) → Na⁺ (aq) + Cl⁻ (aq)</code>.</p>
<p>Een neerslagreactie ontstaat als je twee oplossingen mengt en positieve en negatieve ionen samen een zout vormen dat niet oplost. Dat zout zakt als vaste stof naar beneden.</p></details>

<details><summary>Reactievergelijkingen<span class="goal">Coëfficiënt, index, kloppend maken</span></summary>
<p>De index (klein cijfer onder, zoals in H₂O) zegt hoeveel atomen van dat soort in één deeltje zitten. De coëfficiënt (groot getal ervoor, zoals in 2 H₂O) zegt hoeveel deeltjes er zijn.</p>
<p>Een vergelijking moet kloppen, want atomen verdwijnen of ontstaan niet. Aan beide kanten moeten evenveel atomen van elk soort staan. Je verandert alleen coëfficiënten, nooit indices.</p>
<p>Voorbeeld: <code>2 H₂ + O₂ → 2 H₂O</code></p></details>

<details><summary>Rekenen met mol<span class="goal">Molaire massa, massa, dichtheid</span></summary>
<ul>
<li><code>n = m ÷ M</code> (mol = massa in g ÷ molaire massa in g/mol)</li>
<li><code>m = n × M</code></li>
<li><code>ρ = m ÷ V</code> (dichtheid = massa ÷ volume)</li>
</ul>
<p>De molaire massa vind je door de atoommassa's uit het periodiek systeem op te tellen. H₂O: 2 × 1,008 + 16,00 = 18,02 g/mol.</p>
<p>Gebruik de coëfficiënten als molverhouding. Bij 2 H₂ + O₂ → 2 H₂O reageert 2 mol H₂ met 1 mol O₂.</p></details>

<details><summary>Metaalbinding en geleiding<span class="goal">Waarom geleiden metalen stroom?</span></summary>

<p>Die vrije elektronen kunnen bewegen. Daarom geleiden metalen elektriciteit.</p></details>

LAB.zout=()=>{

LAB.reactie=()=>{

const cnt=(side,off)=>{const o={};side.forEach((t,i)=>{for(const e in t[1])o[e]=(o[e]||0)+t[1][e]*c[off+i]});return o};
const L=cnt(r,0),Rr=cnt(p,nr),els=Object.keys(L);

LAB.enz=()=>{

s+='<text x="160" y="178" font-size="10" text-anchor="middle" fill="currentColor">pH</text><text x="4" y="12" font-size="10" fill="currentColor">activiteit</text><circle cx="'+X(p)+'" cy="'+Y(a)+'" r="7" fill="#f59e0b"/>';
s+='<rect x="340" y="25" width="50" height="125" rx="8" fill="none" stroke="currentColor" opacity=".6"/><rect x="342" y="'+(148-a*110)+'" width="46" height="'+(a*110)+'" fill="#22d3ee" opacity=".55"/>';
for(let q=0;q<Math.round(a*14);q++)s+='<circle cx="'+(352+(q*11)%28)+'" cy="'+(140-(q*19)%100)+'" r="4" fill="#fff" opacity=".8"/>';
s+='<text x="365" y="167" font-size="10" text-anchor="middle" fill="currentColor">'+(k===3?"schuim":"snelheid")+'</text>';

$("pm").textContent=a>.9?"Optimum! Het enzym werkt het best.":a>.4?"Werkt matig.":a>.05?"Werkt slecht: de vorm verandert.":"Bijna geen werking: het enzym past niet meer op de stof.";

/* OVERHOREN */
let T=null;
function overhoor(){
app.innerHTML=BACK+'<h1>📝 Overhoren</h1><p>Je krijgt '+N+' vragen. Tijdens de toets zie je niet of je goed zit. Aan het eind krijg je je cijfer en zie je wat je nog moet leren.</p><p class="mut">Kies je stof:</p><div class="tabs"><button class="chip" data-m="all">Alles</button><button class="chip" data-m="sk">Scheikunde</button><button class="chip" data-m="bio">Biologie</button></div>';
onBack(menu);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
T={qs:shuf(ALL.filter(x=>b.dataset.m==="all"||x.v===b.dataset.m)).slice(0,N).map(x=>({x,o:shuf(x.q[1].map((t,i)=>({t,ok:i===0}))),a:null})),i:0};vraag()})}
function vraag(){
const t=T.qs[T.i],n=T.qs.length;
app.innerHTML='<div class="stat"><span>Vraag '+(T.i+1)+' van '+n+'</span><span>Overhoren</span></div><div class="bar"><i style="width:'+(100*T.i/n)+'%"></i></div><div class="card"><p class="q">'+t.x.q[0]+'</p>'+t.o.map((a,j)=>'<button class="opt" data-j="'+j+'">'+a.t+'</button>').join("")+'</div><button class="go" id="nx" disabled>'+(T.i+1<n?"Volgende":"Klaar, bekijk mijn cijfer")+'</button>';
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
t.a=+b.dataset.j;
document.querySelectorAll(".opt").forEach(e=>e.classList.toggle("sel",e===b));
$("nx").disabled=false});
$("nx").onclick=()=>{if(T.i+1<n){T.i++;vraag()}else uitslag()}}
function uitslag(){
const n=T.qs.length,good=T.qs.filter(q=>q.o[q.a].ok).length,c=Math.round((1+9*good/n)*10)/10;
const p=ls.get("sl_toets2",{});p.last=c;p.best=Math.max(p.best||0,c);ls.set("sl_toets2",p);
const msg=c>=8.5?"Uitstekend! Dit weet je echt. 🏆":c>=7?"Goed gedaan! Nog een paar puntjes.":c>=5.5?"Voldoende, maar je kunt nog meer leren.":"Nog niet voldoende. Ga lekker leren, dan lukt het de volgende keer.";
const col=c>=5.5?"var(--ok)":"var(--bad)";
const wrong=T.qs.filter(q=>!q.o[q.a].ok);
app.innerHTML='<div class="card center pop"><p class="mut">Je cijfer</p><div class="grade" style="color:'+col+'">'+fmt(c)+'</div><p><b>'+good+' van '+n+' goed</b></p><p>'+msg+'</p><div class="tabs" style="justify-content:center"><button class="go" id="again">Opnieuw overhoren</button><button class="go" id="tl">Naar het leerpad</button></div></div>'+(wrong.length?'<h2>Dit moet je nog leren</h2>'+wrong.map(q=>'<div class="card"><p class="q">'+q.x.q[0]+'</p><p>Jouw antwoord: <b style="color:var(--bad)">'+q.o[q.a].t+'</b></p><p>Goed antwoord: <b style="color:var(--ok)">'+q.x.q[1][0]+'</b></p><p class="mut">'+q.x.q[2]+'</p></div>').join(""):"");
$("again").onclick=overhoor;$("tl").onclick=path;window.scrollTo(0,0)}
home();
</script>
